name: CI/CD Pipeline
on:
  push:
    branches: [ first-iteration ]  # ← здесь
    tags:
      - 'v*'
  pull_request:
    branches: [ first-iteration ]

    jobs:
      
      test:
        name: Test & Lint
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - uses: actions/setup-node@v5
            with:
              go-version: '1.21'

          - run: go mod download

          - name: go vet
            run: go vet ./...

          - name: go test
            run: go test -v ./... -v -timeout 30s

publish:
        name: Push to DockerHub
        runs-on: ubuntu-latest
        needs: test
        if: startwith(github.ref, 'refs/tags/v')
        steps:
          - uses: actions/checkout@v4

          - uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - uses: docker/build-push-action@v5
            with:
              context: .
              push: true
              tags: |
                your-dockerhub-username/your-image-name:latest
                your-dockerhub-username/your-image-name:${{ github.ref_name }}
                
