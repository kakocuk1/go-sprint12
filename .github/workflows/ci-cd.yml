name: CI/CD Pipeline
on:
  push:
    branches: [ first-iteration ] 
    tags:
      - 'v*'
  pull_request:
    branches: [ first-iteration ]

jobs:
      
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./... -v -timeout 30s

  publish:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/parcel-tracker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/parcel-tracker:${{ github.ref_name }}

